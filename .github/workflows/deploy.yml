# Builds the PWA and publishes it to GitHub Pages at https://<user>.github.io/<repo>/
# Enable once: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Uses the lockfile when one is committed, otherwise resolves fresh.
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint and architecture check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Serve under /<repository-name>/ (change to "/" when using a custom domain)
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
